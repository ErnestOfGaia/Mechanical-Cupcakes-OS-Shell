server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative redirects (Location: /about/) rather than absolute ones.
    # trailingSlash:true means /about 301s to /about/, and nginx builds that
    # target from its own scheme and port — which behind NPM is plain http on
    # :80. An absolute redirect would therefore downgrade an https request to
    # http and rely on Force SSL to bounce it back. A relative Location keeps
    # the client's original scheme and host.
    absolute_redirect off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Health check endpoint — house standard: every app exposes GET /health -> 200.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets are content-addressed, so they can cache hard.
    # Deliberately uses `expires` rather than `add_header Cache-Control`: an
    # add_header inside a location cancels inheritance of the server-level
    # add_header directives below, which would silently strip the security
    # headers from every JS and CSS response.
    location /_next/static/ {
        expires 1y;
    }

    # This is a MULTI-PAGE static export, not an SPA. next.config.ts sets
    # trailingSlash:true so /about exports as about/index.html and `$uri/`
    # resolves it. The usual SPA fallback (`try_files $uri $uri/ /index.html`,
    # as in the repo-root nginx.conf) is wrong here — it makes any mistyped URL
    # silently render the homepage with a 200 instead of returning a real 404.
    location / {
        try_files $uri $uri/ $uri.html =404;

        # HTML must revalidate on every visit (`expires -1` -> Cache-Control:
        # no-cache). The hashed chunks above cache for a year, so a heuristically
        # cached index.html from a previous deploy would reference chunk files
        # that no longer exist — blank page until a hard refresh. Same reason as
        # above for using `expires` and not `add_header` here.
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # --- Security headers ----------------------------------------------------
    #
    # X-Frame-Options is deliberately ABSENT. The OS shell embeds this app in an
    # iframe from https://mechanicalcupcakes.fun, which is a DIFFERENT origin to
    # pennypost.mechanicalcupcakes.fun, and SAMEORIGIN would make the browser
    # block that embed outright. frame-ancestors is its modern replacement and
    # lets us name exactly who may frame us, which is strictly tighter than
    # SAMEORIGIN would have been.
    #
    # (This comment used to cite an X-Frame-Options line in a repo-root nginx.conf.
    # That file was dead scaffolding — consumed only by a root Dockerfile that
    # copied /app/dist, which a Next build never produces — so its headers shipped
    # in no image. Both files were deleted 2026-08-04.)
    #
    # ⚠️ The www entry is currently INERT, not load-bearing. This comment used to
    # claim www.mechanicalcupcakes.fun "serves the shell itself (200, it does not
    # redirect to the apex)". That is false: https://www fails the TLS handshake
    # (no certificate) and http://www serves Nginx Proxy Manager's default site.
    # The token is harmless — the hostname resolves to this project's own VPS, so
    # there is no takeover vector — but it is a pre-authorised frame-ancestor for a
    # host with no NPM entry. Resolve it one way or the other: either add a www
    # proxy host with a cert that 301s to the apex (then this value is correct as
    # written and stays copy-pasteable to the other apps), or drop www from the
    # line below and from apps/ochi/ochi-app/next.config.ts.
    #
    # X-XSS-Protection is intentionally not set — it is deprecated, ignored by
    # current browsers, and its legacy filter could itself introduce bugs.
    add_header Content-Security-Policy "frame-ancestors 'self' https://mechanicalcupcakes.fun https://www.mechanicalcupcakes.fun" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
