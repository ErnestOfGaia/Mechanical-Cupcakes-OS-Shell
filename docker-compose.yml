services:
  mcos-shell:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: mcos-shell
    restart: unless-stopped
    ports:
      - "8080:3000"
      - "4111:4111"
    env_file:
      - .env
    networks:
      - nginx-proxy

  # mcos-postcards removed 2026-08-05 — see docker-compose.prod.yml for why.
  # Love Mailbox lives in github.com/ErnestOfGaia/postcards and has its own
  # dev stack (app + db) in that repo.

  mcos-ochi:
    build:
      context: ./apps/ochi/ochi-app
    container_name: mcos-ochi
    restart: unless-stopped
    ports:
      - "3003:3003"
    networks:
      - nginx-proxy

  mcos-scout:
    build:
      context: ./apps/scout/scout-app
    container_name: mcos-scout
    restart: unless-stopped
    ports:
      - "3004:3004"
    networks:
      - nginx-proxy

  # Static export served by nginx — no env vars, no secrets, no database. No host
  # port: NPM proxies mcos-pennypost:80 by container name, matching ochi-metabase
  # in docker-compose.prod.yml; ports 80/443 stay NPM-only.
  mcos-pennypost:
    build:
      context: ./apps/pennypost
    container_name: mcos-pennypost
    restart: unless-stopped
    networks:
      - nginx-proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # db-postcards removed 2026-08-05 with mcos-postcards — it existed only to back
  # that service. The live Love Mailbox has its own Postgres (postcards-db-1) in
  # github.com/ErnestOfGaia/postcards. Nothing here ever wrote to this one.

networks:
  nginx-proxy:
    external: true
