services:
  mcos-shell:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: mcos-shell
    restart: unless-stopped
    ports:
      - "8080:3000"
      - "4111:4111"
    env_file:
      - .env
    networks:
      - nginx-proxy

  mcos-postcards:
    build:
      context: ./apps/postcards
    container_name: mcos-postcards
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db-postcards:5432/love_mailbox?connect_timeout=15
    env_file:
      - ./apps/postcards/.env
    networks:
      - nginx-proxy
    depends_on:
      - db-postcards

  mcos-ochi:
    build:
      context: ./apps/ochi/ochi-app
    container_name: mcos-ochi
    restart: unless-stopped
    ports:
      - "3003:3003"
    networks:
      - nginx-proxy

  mcos-scout:
    build:
      context: ./apps/scout/scout-app
    container_name: mcos-scout
    restart: unless-stopped
    ports:
      - "3004:3004"
    networks:
      - nginx-proxy

  # Static export served by nginx — no env vars, no secrets, no database. No host
  # port: NPM proxies mcos-pennypost:80 by container name, matching ochi-metabase
  # in docker-compose.prod.yml; ports 80/443 stay NPM-only.
  mcos-pennypost:
    build:
      context: ./apps/pennypost
    container_name: mcos-pennypost
    restart: unless-stopped
    networks:
      - nginx-proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db-postcards:
    image: postgres:15-alpine
    container_name: db-postcards
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: love_mailbox
    volumes:
      - postcards_data:/var/lib/postgresql/data
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true

volumes:
  postcards_data:
